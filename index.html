<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Portal</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background: #f4f6f8;

            color: #222;

        }


        .container {

            max-width: 1000px;

            margin: 60px auto;

            padding: 20px;

        }


        h1 {

            text-align: center;

            margin-bottom: 10px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 40px;

        }


        .grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(250px, 1fr)
                );

            gap: 20px;

        }


        .card {

            display: block;

            background: white;

            padding: 30px;

            border-radius: 14px;

            text-decoration: none;

            color: #222;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.07);

            transition:
                transform 0.2s,
                box-shadow 0.2s;

        }


        .card:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.12);

        }


        .icon {

            font-size: 42px;

            margin-bottom: 15px;

        }


        .card h2 {

            margin: 0 0 10px;

            font-size: 21px;

        }


        .card p {

            margin: 0;

            color: #777;

            line-height: 1.5;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        📁 Portal
    </h1>


    <div class="subtitle">

        Инструменты для работы
        с документами

    </div>


    <div class="grid">


        <!-- PDF -->

        <a
            href="/pdf-compress"
            class="card"
        >

            <div class="icon">
                📄
            </div>


            <h2>
                Сжатие PDF
            </h2>


            <p>
                Уменьшение размера
                PDF-файлов.
            </p>

        </a>


        <!-- Документы -->

        <a
            href="/word-compress"
            class="card"
        >

            <div class="icon">
                📝
            </div>

            <h2>
                Сжатие Word
            </h2>

            <p>
                Оптимизация DOCX
                и изображений внутри документа.
            </p>

        </a>

        <a
            href="/image"
            class="card"
        >

            <div class="icon">
                🖼️
            </div>

            <h2>
                Изображения
            </h2>

            <p>
                Сжатие и конвертация
                изображений.
            </p>

        
        </a>
        
        <div class="card">

            <div class="icon">
                🔧
            </div>


            <h2>
                PDF-инструменты
            </h2>


            <p>
                Объединение,
                разделение и
                обработка PDF.
            </p>

        </div>


    </div>


</div>


</body>

</html>
