<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Сжатие Word</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            color: #222;

        }

        .container {

            max-width: 650px;

            margin: 60px auto;

            padding: 20px;

        }

        .card {

            background: white;

            padding: 35px;

            border-radius: 14px;

            box-shadow:
                0 5px 25px
                rgba(0,0,0,.08);

        }

        h1 {

            text-align: center;

            margin-top: 0;

            margin-bottom: 30px;

        }

        .upload {

            border: 2px dashed #aaa;

            border-radius: 12px;

            padding: 40px 20px;

            text-align: center;

        }

        .icon {

            font-size: 50px;

            margin-bottom: 15px;

        }

        input[type=file] {

            width: calc(100% - 10px);

            margin-top: 20px;

            margin-left: 160px;

        }

        #filename {

            margin-top: 15px;

            font-weight: bold;

            word-break: break-word;

        }

        .settings {

            margin-top: 25px;

        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

        }

        select {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

        }

        button {

            width: 100%;

            padding: 15px;

            margin-top: 25px;

            border: 0;

            border-radius: 8px;

            background: #222;

            color: white;

            font-size: 17px;

            cursor: pointer;

        }

        button:hover {

            background: #444;

        }

        button:disabled {

            opacity: .6;

            cursor: wait;

        }

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #666;

            text-decoration: none;

        }

    </style>

</head>


<body>


<div class="container">


    <div class="card">


        <h1>
            📝 Сжатие Word
        </h1>


        <form
            method="POST"
            enctype="multipart/form-data"
            onsubmit="compress()"
        >


            <div class="upload">


                <div class="icon">
                    📝
                </div>


                <div>
                    Выберите DOCX
                </div>


                <input
                    type="file"
                    name="file"
                    accept=".docx"
                    required
                    onchange="showFile(this)"
                >


                <div id="filename"></div>


            </div>


            <div class="settings">


                <label>
                    Качество изображений
                </label>


                <select name="quality">

                    <option value="40">
                        40% — сильное сжатие
                    </option>

                    <option value="60">
                        60% — среднее сжатие
                    </option>

                    <option
                        value="70"
                        selected
                    >
                        70% — рекомендуется
                    </option>

                    <option value="80">
                        80% — хорошее качество
                    </option>

                    <option value="90">
                        90% — высокое качество
                    </option>

                </select>


            </div>


            <button
                type="submit"
                id="button"
            >
                Сжать DOCX
            </button>


        </form>


        <a
            href="/"
            class="back"
        >
            ← Вернуться на главную
        </a>


    </div>


</div>


<script>

function showFile(input) {

    if (
        input.files &&
        input.files.length > 0
    ) {

        document.getElementById(
            "filename"
        ).textContent =
            "Выбран файл: " +
            input.files[0].name;

    }

}


function compress() {

    const button =
        document.getElementById(
            "button"
        );

    button.disabled = true;

    button.textContent =
        "⏳ Сжимаем DOCX...";

}

</script>


</body>

</html>
