<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Сжатие Excel</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                'Segoe UI',
                Arial,
                sans-serif;

            background: #f8fafc;

            color: #1e293b;

        }

        .container {

            max-width: 650px;

            margin: 60px auto;

            padding: 20px;

        }

        .card {

            background: white;

            padding: 35px;

            border-radius: 16px;

            box-shadow:
                0 4px 20px
                rgba(0,0,0,.06);

        }

        h1 {

            text-align: center;

            margin-top: 0;

            margin-bottom: 30px;

        }

        .upload {

            border: 2px dashed #cbd5e1;

            border-radius: 14px;

            padding: 40px 20px;

            text-align: center;

        }

        .icon {

            font-size: 50px;

            margin-bottom: 15px;

        }

        input[type="file"] {

            width: calc(100% - 10px);

            margin-top: 20px;

            margin-left: 10px;

        }

        #filename {

            margin-top: 15px;

            font-weight: 600;

            word-break: break-word;

        }

        .settings {

            margin-top: 25px;

        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: 600;

        }

        select {

            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 16px;

            background: white;

        }

        button {

            width: 100%;

            padding: 15px;

            margin-top: 10px;

            border: 0;

            border-radius: 9px;

            background: #4f46e5;

            color: white;

            font-size: 17px;

            cursor: pointer;

        }

        button:hover {

            background: #4338ca;

        }

        button:disabled {

            opacity: .6;

            cursor: wait;

        }

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #64748b;

            text-decoration: none;

        }

    </style>

</head>


<body>


<div class="container">


    <div class="card">


        <h1>
            📗 Сжатие Excel
        </h1>


        <form
            method="POST"
            enctype="multipart/form-data"
            onsubmit="compress()"
        >


            <div class="upload">


                <div class="icon">
                    📗
                </div>


                <div>
                    Выберите файл XLSX
                </div>


                <input
                    type="file"
                    name="file"
                    accept=".xlsx"
                    required
                    onchange="showFile(this)"
                >


                <div id="filename"></div>


            </div>


            <div class="settings">


                <label>
                    Качество изображений
                </label>


                <select name="quality">

                    <option value="40">
                        40% — сильное сжатие
                    </option>

                    <option value="50">
                        50% — сильное
                    </option>

                    <option
                        value="65"
                        selected
                    >
                        65% — рекомендуется
                    </option>

                    <option value="75">
                        75% — хорошее качество
                    </option>

                    <option value="85">
                        85% — высокое качество
                    </option>

                </select>


                <label>
                    Максимальная ширина изображения
                </label>


                <select name="max_width">

                    <option value="1200">
                        1200 px — сильное сжатие
                    </option>

                    <option value="1600">
                        1600 px — среднее
                    </option>

                    <option
                        value="1920"
                        selected
                    >
                        1920 px — рекомендуется
                    </option>

                    <option value="2560">
                        2560 px — высокое качество
                    </option>

                </select>


            </div>


            <button
                type="submit"
                id="button"
            >
                Сжать Excel
            </button>


        </form>


        <a
            href="/"
            class="back"
        >
            ← Вернуться на главную
        </a>


    </div>


</div>


<script>

function showFile(input) {

    if (
        input.files &&
        input.files.length > 0
    ) {

        document.getElementById(
            "filename"
        ).textContent =
            "Выбран файл: " +
            input.files[0].name;

    }

}


function compress() {

    const button =
        document.getElementById(
            "button"
        );

    button.disabled = true;

    button.textContent =
        "⏳ Сжимаем Excel...";

}

</script>


</body>

</html>
