<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Изображения
    </title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            color: #222;

        }

        .container {

            max-width: 650px;

            margin: 60px auto;

            padding: 20px;

        }

        .card {

            background: white;

            padding: 35px;

            border-radius: 14px;

            box-shadow:
                0 5px 25px
                rgba(0,0,0,.08);

        }

        h1 {

            text-align: center;

            margin-top: 0;

        }

        .upload {

            border: 2px dashed #aaa;

            border-radius: 12px;

            padding: 40px 20px;

            text-align: center;

        }

        .icon {

            font-size: 50px;

            margin-bottom: 15px;

        }

        input[type=file] {

            width: 100%;

            margin-top: 20px;

            margin-left: 160px;

        }

        .settings {

            margin-top: 25px;

        }

        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 7px;

            font-weight: bold;

        }

        select,
        input[type=number] {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

        }

        button {

            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: 0;

            border-radius: 8px;

            background: #222;

            color: white;

            font-size: 17px;

            cursor: pointer;

        }

        button:hover {

            background: #444;

        }

        button:disabled {

            opacity: .6;

        }

        #filename {

            margin-top: 15px;

            font-weight: bold;

            word-break: break-word;

        }

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #666;

            text-decoration: none;

        }

    </style>

</head>


<body>


<div class="container">

    <div class="card">


        <h1>
            🖼️ Изображения
        </h1>


        <form
            method="POST"
            enctype="multipart/form-data"
            onsubmit="convertImage()"
        >


            <div class="upload">

                <div class="icon">
                    🖼️
                </div>


                <div>
                    Выберите изображение
                </div>


                <input
                    type="file"
                    name="file"
                    accept=".jpg,.jpeg,.png,.webp,.bmp,.tiff"
                    required
                    onchange="showFile(this)"
                >


                <div id="filename"></div>

            </div>


            <div class="settings">


                <label>
                    Формат
                </label>


                <select name="format">

                    <option value="original">
                        Оригинальный
                    </option>

                    <option value="JPEG">
                        JPG
                    </option>

                    <option value="PNG">
                        PNG
                    </option>

                    <option value="WEBP">
                        WEBP
                    </option>

                    <option value="BMP">
                        BMP
                    </option>

                </select>


                <label>
                    Качество
                </label>


                <select name="quality">

                    <option value="40">
                        40% — сильное сжатие
                    </option>

                    <option value="60">
                        60% — среднее
                    </option>

                    <option value="80" selected>
                        80% — хорошее качество
                    </option>

                    <option value="90">
                        90% — высокое качество
                    </option>

                    <option value="100">
                        100% — максимальное
                    </option>

                </select>


                <label>
                    Максимальная ширина
                </label>


                <input
                    type="number"
                    name="width"
                    placeholder="Например: 1920"
                    min="1"
                >


            </div>


            <button
                type="submit"
                id="button"
            >

                Обработать изображение

            </button>


        </form>


        <a
            href="/"
            class="back"
        >

            ← Вернуться на главную

        </a>


    </div>

</div>


<script>

function showFile(input) {

    if (
        input.files &&
        input.files.length > 0
    ) {

        document.getElementById(
            "filename"
        ).textContent =
            "Выбран файл: " +
            input.files[0].name;

    }

}


function convertImage() {

    const button =
        document.getElementById(
            "button"
        );

    button.disabled = true;

    button.textContent =
        "⏳ Обработка...";

}

</script>


</body>

</html>
